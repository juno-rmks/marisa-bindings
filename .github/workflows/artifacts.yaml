name: Artifacts
run-name: Build artifacts (sdist/wheel) and smoke-test them across OS

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package-build:
    name: Build and test artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install -U pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions (twine check)
        run: python -m twine check dist/*

      - name: Smoke test (Linux/macOS) - install wheel
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m venv .venv-wheel
          . .venv-wheel/bin/activate
          python -m pip install -U pip
          python -m pip install dist/*.whl
          python -c "import marisa_bindings._marisa; print('wheel import OK')"

      - name: Smoke test (Windows) - install wheel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv-wheel
          .\.venv-wheel\Scripts\Activate.ps1
          python -m pip install -U pip
          $wheel = Get-ChildItem dist -Filter *.whl | Select-Object -First 1
          if (-not $wheel) { throw "No wheel found in dist/" }
          python -m pip install $wheel.FullName
          python -c "import marisa_bindings._marisa; print('wheel import OK')"

      - name: Smoke test (Linux/macOS) - install sdist
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m venv .venv-sdist
          . .venv-sdist/bin/activate
          python -m pip install -U pip
          python -m pip install dist/*.tar.gz
          python -c "import marisa_bindings._marisa; print('sdist import OK')"

      - name: Smoke test (Windows) - install sdist
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv-sdist
          .\.venv-sdist\Scripts\Activate.ps1
          python -m pip install -U pip
          $sdist = Get-ChildItem dist -Filter *.tar.gz | Select-Object -First 1
          if (-not $sdist) { throw "No sdist found in dist/" }
          python -m pip install $sdist.FullName
          python -c "import marisa_bindings._marisa; print('sdist import OK')"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}-py${{ matrix.python-version }}
          path: dist/*
