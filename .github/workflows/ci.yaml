name: CI
run-name: Test across OS and Python versions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-matrix:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SWIG (Windows)
        if: runner.os == 'Windows'
        run: choco install -y swig

      - name: Install SWIG (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install swig

      - name: Install SWIG (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y swig

      - name: Upgrade build tools
        run: python -m pip install -U pip setuptools wheel

      - name: Install
        run: python -m pip install -v .

      - name: Install test deps
        run: python -m pip install -U pytest coverage pytest-benchmark pytest-mock

      - name: Test
        run: python -m pytest -q
