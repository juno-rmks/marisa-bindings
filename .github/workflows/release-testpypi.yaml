name: Release (TestPyPI)
run-name: TestPyPI ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    tags:
      - "marisa-bindings-v1.*"

permissions:
  contents: read
  id-token: write

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y swig

      - name: Install build tools
        run: python -m pip install -U pip build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: python -m pip install -U pip cibuildwheel==2.* build twine

      - name: Install SWIG (Windows)
        if: runner.os == 'Windows'
        run: choco install -y swig

      - name: Install SWIG (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install swig

      - name: Install SWIG (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y swig

      - name: Build wheels via cibuildwheel
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "pp*"
          CIBW_TEST_COMMAND: 'python -c "import marisa_bindings._marisa"'
        run: python -m cibuildwheel --output-dir dist

      - name: Validate wheels (twine check)
        run: python -m twine check dist/*

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ runner.os }}
          path: dist/*.whl

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build-sdist, build-wheels]
    environment:
      name: testpypi
      url: https://test.pypi.org/project/marisa-bindings/
    steps:
      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: dist-sdist
          path: dist

      - name: Download wheels (Windows)
        uses: actions/download-artifact@v4
        with:
          name: dist-wheels-Windows
          path: dist

      - name: Download wheels (macOS)
        uses: actions/download-artifact@v4
        with:
          name: dist-wheels-macOS
          path: dist

      - name: Download wheels (Linux)
        uses: actions/download-artifact@v4
        with:
          name: dist-wheels-Linux
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
