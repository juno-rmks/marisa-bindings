[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [
    { name = "Nobuyuki Sekimori", email = "43375309+juno-rmks@users.noreply.github.com" },
]
name = "marisa-bindings"
description = "Thin Python bindings for the C++ MARISA Trie library implemented using SWIG."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
classifiers = ["Programming Language :: C++", "Programming Language :: Python"]
dependencies = []
dynamic = ["version"]

[project.urls]
"Source Code" = "https://github.com/juno-rmks/marisa-bindings/"
"Issue Tracker" = "https://github.com/juno-rmks/marisa-bindings/issues/"
"Documentation" = "https://marisa-bindings.readthedocs.io/"

[project.optional-dependencies]
test = ["pytest", "coverage", "pytest-benchmark", "pytest-mock", "mypy"]
docs = [
    "Sphinx==5.3.0",
    "sphinx-intl==2.1.0",
    "sphinx-rtd-theme==1.2.0",
    "myst-parser==1.0.0",
]
dev = [
    "build",
    "twine",
    "pylint",
    "black",
    "isort",
    "marisa-bindings[test,docs]",
]

[tool.setuptools.dynamic]
version = { attr = "marisa_bindings.__version__" }

[tool.pylint.format]
max-line-length = "88"

[tool.black]
skip-string-normalization = true

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--benchmark-skip", "-m", "not typing"]
filterwarnings = ["error"]
testpaths = ["tests"]
markers = [
    "benchmark: performance benchmarks (skipped by default; run with -m benchmark)",
    "typing: type checking tests (mypy)"
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]
